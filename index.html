<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gantt</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gantt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f2; --panel:#ffffff; --ink:#1c1e23; --ink2:#5f6470; --ink3:#9096a2;
  --line:#e3e3de; --line2:#efefeb; --weekend:#f3f2ed; --hover:#f1f1ec; --sel:#eef1ff;
  --accent:#3b4fd8; --accent-ink:#fff; --today:#e5484d; --warn:#c98a0b; --ok:#2f9e5b;
  --shadow:0 10px 30px rgba(20,22,30,.14), 0 2px 6px rgba(20,22,30,.08);
  --r:10px;
  font-family:Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121316; --panel:#1b1c20; --ink:#ececef; --ink2:#a2a7b3; --ink3:#6e7380;
    --line:#2b2d33; --line2:#212227; --weekend:#18191d; --hover:#24262b; --sel:#232a4a;
    --accent:#7d8cff; --accent-ink:#0f1120; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--today)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
header.top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:20}
.title{flex:1 1 160px;min-width:0;display:flex;align-items:center;gap:8px}
#projName{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-weight:800;font-size:18px;padding:5px 8px;border-radius:8px;letter-spacing:-.01em}
#projName:hover{border-color:var(--line)}
#projName:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap;padding:4px 6px;border-radius:8px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.sync[data-s=saved] .dot{background:var(--ok)}
.sync[data-s=saving] .dot,.sync[data-s=offline] .dot{background:var(--warn)}
.sync[data-s=error] .dot{background:var(--today)}
.sync[data-s=auth]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sync[data-s=auth] .dot{background:var(--accent-ink)}
@media (max-width:760px){.sync[data-s=auth] .txt{display:inline}}
.sync[data-s=connecting] .dot{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.tools{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;height:36px}
.seg button{padding:0 11px;border-radius:7px;font-weight:600;color:var(--ink2);font-size:13px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:760px){
  header.top{gap:6px;padding:8px}
  .title{flex:1 1 0;order:1}
  .sync{order:2}.sync .txt{display:none}
  #btnMore{order:3}
  .tools{order:4;width:100%;justify-content:space-between}
  #projName{font-size:16px}
  .seg button{padding:0 9px}
  .hide-sm{display:none}
}

/* chart */
main{flex:1;position:relative;min-height:0}
#scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#sheet{position:relative}
#hdrRow{position:sticky;top:0;z-index:6;display:flex;background:var(--panel)}
#corner{position:sticky;left:0;z-index:7;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;flex:none}
#corner .c{padding:0 8px 8px}
#corner .cname{flex:1;padding-left:14px;display:flex;align-items:center;gap:6px}
#scale{position:relative;border-bottom:1px solid var(--line);flex:none}
.sc-top,.sc-bot{position:absolute;left:0;right:0}
.sc-top{top:0;height:24px;border-bottom:1px solid var(--line2)}
.sc-bot{top:24px;bottom:0}
.sc-seg{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.sc-seg span{position:sticky;left:var(--stick,0px);display:inline-block;padding:5px 7px}
.sc-u{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);font-size:11px;color:var(--ink2);text-align:center;line-height:1.15;padding-top:4px;overflow:hidden;white-space:nowrap}
.sc-u b{display:block;font-weight:700;color:var(--ink);font-size:12px}
.sc-u.we{background:var(--weekend)}
.sc-u.td b{color:#fff;background:var(--today);border-radius:6px;display:table;margin:0 auto;padding:0 4px}
#bodyRow{display:flex}
#left{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line);flex:none}
.lrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line2);padding-right:6px;cursor:pointer;white-space:nowrap;overflow:hidden}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--sel)}
.lrow .tg{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--ink2);flex:none}
.lrow .tg:hover{background:var(--line)}
.lrow .tg svg{transition:transform .15s}
.lrow .tg.closed svg{transform:rotate(-90deg)}
.lrow .sp{width:22px;flex:none}
.lrow .dot{width:10px;height:10px;border-radius:3px;flex:none}
.lrow .dot.ms{transform:rotate(45deg) scale(.85);border-radius:2px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lrow.isph .nm{font-weight:800}
.lrow .who{width:84px;flex:none;color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.lrow .pct{width:40px;flex:none;text-align:right;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
#tl{position:relative;flex:none;overflow:hidden}
#tlbg,#bars{position:absolute;inset:0}
#arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#arrows path{fill:none;stroke:var(--ink3);stroke-width:1.5}
#arrows path.hl{stroke:var(--accent);stroke-width:2}
.gcol{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.gcol.mo{border-left-color:var(--line)}
.gcol.we{background:var(--weekend)}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.75;z-index:1}
.rowline{position:absolute;left:0;right:0;border-bottom:1px solid var(--line2)}
.rowline.sel{background:var(--sel);border-bottom-color:transparent}
.bar,.ms,.ph{position:absolute;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;z-index:2}
.bar{border-radius:7px;background:var(--c);color:#fff;cursor:grab;display:flex;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bar .prog{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.22);border-radius:7px 0 0 7px;pointer-events:none}
.bar .prog.full{border-radius:7px}
.bar .in{position:relative;padding:0 9px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.out{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink);pointer-events:none}
.out em{font-style:normal;color:var(--ink2);font-weight:500}
.bar .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.bar .h::after{content:"";position:absolute;top:30%;bottom:30%;left:4px;width:2px;border-radius:2px;background:rgba(255,255,255,.75);opacity:0;transition:opacity .15s}
.bar:hover .h::after,.bar.sel .h::after{opacity:1}
.bar .hl{left:0}.bar .hr{right:0}
@media (pointer:coarse){.bar .h{width:16px}.bar .h::after{left:7px;opacity:1}.bar .in{padding:0 16px}}
.bar.sel,.ms.sel .dia,.ph.sel .pb{outline:2px solid var(--ink);outline-offset:2px}
.bar.lifted,.ms.lifted,.ph.lifted{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));z-index:5}
.bar.lifted{cursor:grabbing}
.ms{cursor:grab}
.ms .dia{position:absolute;inset:3px;background:var(--c);transform:rotate(45deg);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.ph{cursor:grab}
.ph .pb{position:absolute;left:0;right:0;top:0;height:8px;background:var(--c);border-radius:3px 3px 0 0;opacity:.9}
.ph .pb::before,.ph .pb::after{content:"";position:absolute;top:100%;border-top:6px solid var(--c);border-left:5px solid transparent;border-right:5px solid transparent}
.ph .pb::before{left:0;border-left:0}
.ph .pb::after{right:0;border-right:0}
.ph .pp{position:absolute;left:0;top:0;height:8px;background:rgba(0,0,0,.3);border-radius:3px 0 0 0}
#zoomCtl{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:8;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
#zoomCtl button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
#zoomCtl button+button{border-top:1px solid var(--line)}
#zoomCtl button:hover{background:var(--hover)}
#zoomCtl button:disabled{opacity:.3}
#dragTip{position:fixed;z-index:50;background:var(--ink);color:var(--panel);font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px;pointer-events:none;display:none;white-space:nowrap;transform:translate(-50%,-100%)}

.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:10;pointer-events:none}
.empty .card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;text-align:center;box-shadow:var(--shadow)}
.empty h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.empty p{margin:0 0 18px;color:var(--ink2);line-height:1.5}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{position:absolute;left:50%;top:40%;transform:translateX(-50%);color:var(--ink2);background:var(--panel);border:1px dashed var(--line);padding:14px 18px;border-radius:12px;z-index:3;text-align:center;font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--panel);z-index:41;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#drawer h3{margin:0;padding:18px 18px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
#plist{flex:1;overflow:auto;padding:0 10px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:10px;margin-bottom:2px}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--sel)}
.pitem b{font-weight:700;font-size:15px}
.pitem small{color:var(--ink2);font-size:12px;margin-top:2px}
#drawer .foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom))}

/* menu */
.menu{position:fixed;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:240px;display:none;max-height:80vh;overflow:auto}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .chk{margin-left:auto;color:var(--accent);font-weight:800}
.menu .danger{color:var(--today)}

/* editor */
#editor{position:fixed;z-index:30;background:var(--panel);display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .22s ease}
@media (min-width:761px){#editor{top:12px;right:12px;bottom:12px;width:370px;border-radius:16px;border:1px solid var(--line);transform:translateX(calc(100% + 24px))}}
@media (max-width:760px){#editor{left:0;right:0;bottom:0;max-height:72dvh;border-radius:18px 18px 0 0;transform:translateY(102%);padding-bottom:env(safe-area-inset-bottom)}}
#editor.open{transform:none}
.ed-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ed-h .grab{display:none}
@media (max-width:760px){.ed-h{padding-top:18px;position:relative}.ed-h .grab{display:block;position:absolute;top:6px;left:50%;margin-left:-18px;width:36px;height:4px;border-radius:4px;background:var(--line)}}
.ed-h h4{margin:0;flex:1;font-size:15px}
.ed-b{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.lab{font-size:12px;font-weight:700;color:var(--ink2)}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;font-size:15px}
textarea.inp{height:70px;padding:8px 10px;resize:vertical}
.inp:focus{outline:none;border-color:var(--accent)}
.inp:disabled{opacity:.65}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 62px;gap:8px}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.inp{min-width:0}
input[type=date].inp{padding:0 6px;font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.prog-row{display:flex;align-items:center;gap:10px}
.prog-row input[type=range]{flex:1;accent-color:var(--accent);height:30px}
.prog-row output{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.deps{border:1px solid var(--line);border-radius:9px;max-height:180px;overflow:auto;background:var(--bg)}
.deps label{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.deps label:last-child{border-bottom:0}
.deps input{width:18px;height:18px;accent-color:var(--accent)}
.deps .none{padding:10px;color:var(--ink3);font-size:13px}
.note{font-size:12px;color:var(--ink3)}
.ed-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:rgba(10,12,20,.4)}
.modal.on{display:grid}
.modal .box{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:20px;width:min(440px,100%);max-height:88dvh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 14px;color:var(--ink2);line-height:1.5}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal img{max-width:100%;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <button class="btn icon" id="btnMenu" aria-label="Proyectos"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="title"><input id="projName" aria-label="Nombre del proyecto" placeholder="Proyecto" autocomplete="off"></div>
  <button class="sync" id="sync" data-s="connecting"><span class="dot"></span><span class="txt">Conectando…</span></button>
  <div class="tools">
    <div class="seg" id="zoom" role="tablist">
      <button data-z="day">Día</button><button data-z="week">Semana</button><button data-z="month">Mes</button>
    </div>
    <button class="btn" id="btnToday">Hoy</button>
    <button class="btn icon" id="btnUndo" aria-label="Deshacer"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn icon hide-sm" id="btnRedo" aria-label="Rehacer"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="btn primary" id="btnAdd"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tarea</button>
  </div>
  <button class="btn icon" id="btnMore" aria-label="Más opciones"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</header>

<main>
  <div id="scroller">
    <div id="sheet">
      <div id="hdrRow"><div id="corner"></div><div id="scale"></div></div>
      <div id="bodyRow">
        <div id="left"></div>
        <div id="tl"><div id="tlbg"></div><svg id="arrows"></svg><div id="bars"></div></div>
      </div>
    </div>
  </div>
  <div id="zoomCtl" aria-label="Zoom">
    <button id="zIn" aria-label="Acercar" title="Acercar (+)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zOut" aria-label="Alejar" title="Alejar (−)"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
  <div id="emptyState" class="empty" style="display:none">
    <div class="card">
      <h2>Tus diagramas de Gantt</h2>
      <p>Crea un proyecto para empezar. Se guarda en tu Google Drive (carpeta “Gantt (web app)”) y lo verás igual en el ordenador, el iPad y el móvil.</p>
      <div class="row">
        <button class="btn primary" data-act="newProject">Nuevo proyecto</button>
        <button class="btn" data-act="example">Ver un ejemplo</button>
      </div>
    </div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <h3>Proyectos</h3>
  <div id="plist"></div>
  <div class="foot">
    <a class="btn" id="driveLink" href="#" target="_blank" rel="noopener" style="text-decoration:none;display:none"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Abrir carpeta en Drive</a>
    <button class="btn primary" data-act="newProject"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo proyecto</button>
    <button class="btn" data-act="example">Crear proyecto de ejemplo</button>
    <button class="btn" data-act="import">Importar archivo…</button>
  </div>
</aside>

<div class="menu" id="moreMenu"></div>

<section id="editor" aria-label="Editar tarea">
  <div class="ed-h"><span class="grab"></span><h4 id="edTitle">Tarea</h4><button class="btn primary" id="edDone">Listo</button></div>
  <div class="ed-b" id="edBody"></div>
</section>

// ---------- local cache ----------
const LS = {

const CLIENT = rid('c');

const projects = new Map();

let sel = null;            // selected task id
let editId = null, editSnap = null;
const undoS = {}, redoS = {};
const unsynced = new Set(LS.get('unsynced', []));
const deletedPending = new Set(LS.get('deleted', []));

function normTask(t, i){
  if (!t || typeof t !== 'object') return null;
  const tn = todayN();
  let s = typeof t.start === 'string' && ISO.test(t.start) ? t.start : fromN(tn);
  let e = typeof t.end === 'string' && ISO.test(t.end) ? t.end : s;
  if (toN(e) < toN(s)) e = s;
  const type = ['task','milestone','phase'].includes(t.type) ? t.type : 'task';
  if (type === 'milestone') e = s;
  return {
    id: typeof t.id === 'string' && /^[\w-]{1,40}$/.test(t.id) ? t.id : rid('t') + i,
    name: String(t.name ?? 'Tarea').slice(0, 200),
    type, start: s, end: e,
    progress: Math.max(0, Math.min(100, Math.round(Number(t.progress) || 0))),
    color: PALETTE.includes(t.color) ? t.color : PALETTE[i % PALETTE.length],
    who: String(t.who ?? '').slice(0, 60),
    parent: typeof t.parent === 'string' ? t.parent : null,
    deps: Array.isArray(t.deps) ? t.deps.filter(x => typeof x === 'string').slice(0, 50) : [],

    collapsed: !!t.collapsed,
  };
}
function normProject(d, id){
  const tasks = (Array.isArray(d.tasks) ? d.tasks : []).map(normTask).filter(Boolean);
  const ids = new Set(tasks.map(t => t.id));
  const phases = new Set(tasks.filter(t => t.type === 'phase').map(t => t.id));
  for (const t of tasks){
    if (t.parent && (!phases.has(t.parent) || t.parent === t.id)) t.parent = null;
    t.deps = [...new Set(t.deps.filter(x => ids.has(x) && x !== t.id))];
  }
  // break parent cycles
  for (const t of tasks){ let p = t.parent, n = 0; while (p && n < 100){ if (p === t.id){ t.parent = null; break; } p = tasks.find(x => x.id === p)?.parent; n++; } }
  return { id, name: String(d.name ?? 'Proyecto').slice(0, 120) || 'Proyecto', tasks,
    createdAt: Number(d.createdAt) || Date.now(), updatedAt: Number(d.updatedAt) || 0, by: String(d.by || '') };
}
// load cache
for (const [id, d] of Object.entries(LS.get('projects', {}))) projects.set(id, normProject(d, id));
const cur = () => projects.get(ui.current);
function persistLocal(){
  const o = {}; for (const [id, p] of projects) o[id] = serialize(p);
  LS.set('projects', o); LS.set('unsynced', [...unsynced]); LS.set('deleted', [...deletedPending]);
}
function saveUI(){ LS.set('ui', ui); }
const serialize = p => ({ name: p.name, tasks: p.tasks, createdAt: p.createdAt, updatedAt: p.updatedAt, by: p.by, v: 1 });

// ---------- Google Drive sync (Google Identity Services + Drive REST v3) ----------
// Scope drive.file: the app only sees the files it creates. Each project = one JSON file in the
// "Gantt (web app)" folder, identified by appProperties.pid. Saves overwrite the same file.
const FOLDER = 'Gantt (web app)';
const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const clientId = () => (window.GANTT_CONFIG && window.GANTT_CONFIG.googleClientId) || LS.get('clientId', '') || '';
let token = LS.get('token', null);   // { v, exp }
let tokenClient = null, cloudReady = false, syncState = 'connecting', lastErr = '';
let folderId = LS.get('folder', null), folderUrl = LS.get('folderUrl', null);
const fileOf = LS.get('files', {});    // pid -> { id, t } (Drive id, modifiedTime)
const timers = {}, inflight = new Set(), again = new Set();
let pulling = false, pullAgain = false, tokenWaiters = [];
const saveFiles = () => { LS.set('files', fileOf); LS.set('folder', folderId); LS.set('folderUrl', folderUrl); };
function setSync(s, msg){
  syncState = s;
  const T = { connecting:'Conectando con Drive…', saved:'Guardado en Drive', saving:'Guardando en Drive…', local:'Solo en este dispositivo', offline:'Sin conexión · se guardará al volver', error:'Error con Drive', auth:'Conectar Google Drive', setup:'Configurar Google Drive' };
  const el = $('#sync'); el.dataset.s = (s === 'auth' || s === 'setup') ? 'auth' : s; el.querySelector('.txt').textContent = T[s]; el.title = msg || T[s];
}
const tokenValid = () => token && token.v && token.exp > Date.now() + 60000;
function loadGIS(){
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function initTokenClient(){

    callback: r => {

// interactive: must be called from a user gesture (opens Google's popup)

    catch { tokenWaiters = tokenWaiters.filter(f => f !== res); res(false); }

class DriveErr extends Error { constructor(code, status){ super(code); this.code = code; this.status = status; } }
async function api(method, url, { json, body, headers, raw } = {}){

const q = s => encodeURIComponent(s);
function multipart(meta, content){

}
function showDriveError(e, quiet){
  const c = e && e.code;
  if (c === 'auth') { setSync('auth', 'Toca para conectar con tu Google Drive.'); return; }
  const m = c === 'offline' ? 'Sin conexión con Drive. Tus cambios siguen en este dispositivo y se subirán después.'
    : c === 'forbidden' ? 'Google Drive ha rechazado el acceso. Toca para volver a conectar.'
    : 'No se pudo guardar en Drive. Tus cambios siguen en este dispositivo.';

}
function saveProject(p, immediate){
  p.updatedAt = Date.now(); p.by = CLIENT;
  unsynced.add(p.id); persistLocal();
  clearTimeout(timers[p.id]);
  if (cloudReady) { if (syncState === 'saved') setSync('saving'); timers[p.id] = setTimeout(() => { timers[p.id] = 0; flush(p.id); }, immediate ? 0 : 1500); }
}
const fileName = p => `${p.name.replace(/[\\/]/g, '-').slice(0, 100)}.gantt.json`;
async function ensureFolder(){
  if (folderId) return folderId;
  const r = await api('GET', `${API}/files?q=${q(`name='${FOLDER.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id,webViewLink,createdTime)&orderBy=createdTime`);
  let f = (r.files || [])[0];
  if (!f) f = await api('POST', `${API}/files?fields=id,webViewLink`, { json: { name: FOLDER, mimeType: 'application/vnd.google-apps.folder' } });
  folderId = f.id; folderUrl = f.webViewLink || null; saveFiles(); return folderId;
}
async function listFolder(){
  const out = []; let pt = '';
  for (let i = 0; i < 20; i++){
    const r = await api('GET', `${API}/files?q=${q(`'${folderId}' in parents and trashed=false`)}&fields=nextPageToken,files(id,name,modifiedTime,appProperties)&pageSize=1000${pt ? '&pageToken=' + q(pt) : ''}`);
    (r.files || []).forEach(f => out.push(f)); pt = r.nextPageToken; if (!pt) break;
  }
  return out;
}
async function flush(id){
  if (!cloudReady) return;
  if (inflight.has(id)) { again.add(id); return; }
  inflight.add(id);
  try {
    const p = projects.get(id), f = fileOf[id];
    if (!p) {
      if (f) { try { await api('PATCH', `${API}/files/${f.id}`, { json: { trashed: true } }); } catch (e) { if (e.code !== 'notfound') throw e; } }
      delete fileOf[id]; deletedPending.delete(id);
    } else {
      const ver = p.updatedAt;
      const content = JSON.stringify({ app: 'gantt', v: 1, savedAt: new Date().toISOString(), project: serialize(p) });
      let r;
      if (f) {
        try { const m = multipart({ name: fileName(p) }, content); r = await api('PATCH', `${UP}/files/${f.id}?uploadType=multipart&fields=id,modifiedTime`, m); }
        catch (e) { if (e.code !== 'notfound') throw e; r = null; }
      }
      if (!r) { const m = multipart({ name: fileName(p), parents: [folderId], mimeType: 'application/json', appProperties: { pid: id } }, content); r = await api('POST', `${UP}/files?uploadType=multipart&fields=id,modifiedTime`, m); }
      fileOf[id] = { id: r.id, t: r.modifiedTime };
      if (projects.get(id)?.updatedAt === ver && !timers[id]) unsynced.delete(id);
    }
    saveFiles(); persistLocal();
  } catch (e) {
    inflight.delete(id); again.delete(id); showDriveError(e, syncState === 'offline' || e.code === 'auth'); return;
  }
  inflight.delete(id);
  if (again.has(id)) { again.delete(id); flush(id); return; }
  refreshSyncDot();
}
function refreshSyncDot(){
  if (!cloudReady) return;
  const busy = unsynced.size || deletedPending.size || inflight.size;
  if (!busy) setSync('saved', `Guardado en tu carpeta "${FOLDER}" de Google Drive`); else setSync('saving');
}
async function pull(first){
  if (!tokenValid()) { cloudReady = false; setSync('auth', 'Toca para conectar con tu Google Drive.'); return; }
  if (pulling) { pullAgain = true; return; }
  pulling = true;
  try {
    await ensureFolder();
    let files;
    try { files = await listFolder(); } catch (e) { if (e.code === 'notfound') { folderId = null; await ensureFolder(); files = await listFolder(); } else throw e; }
    const byPid = {};
    for (const f of files) { const pid = f.appProperties && f.appProperties.pid; if (!pid) continue; if (!byPid[pid] || f.modifiedTime > byPid[pid].modifiedTime) byPid[pid] = f; }
    let changed = false;
    for (const [pid, f] of Object.entries(byPid)) {
      if (deletedPending.has(pid)) { fileOf[pid] = { id: f.id, t: f.modifiedTime }; continue; }
      if (unsynced.has(pid) || inflight.has(pid)) { if (!fileOf[pid]) fileOf[pid] = { id: f.id, t: f.modifiedTime }; continue; }
      if (fileOf[pid] && fileOf[pid].id === f.id && fileOf[pid].t === f.modifiedTime && projects.has(pid)) continue;

      const pd = data && data.project ? data.project : data;
      if (!pd || !Array.isArray(pd.tasks)) continue;
      if (unsynced.has(pid) || inflight.has(pid)) continue;
      projects.set(pid, normProject(pd, pid)); fileOf[pid] = { id: f.id, t: f.modifiedTime }; changed = true;
    }
    for (const pid of Object.keys(fileOf)) if (!byPid[pid] && !unsynced.has(pid) && !inflight.has(pid) && !deletedPending.has(pid)) { delete fileOf[pid]; if (projects.delete(pid)) changed = true; }
    for (const pid of projects.keys()) if (!fileOf[pid] && !byPid[pid]) unsynced.add(pid);

    cloudReady = true;
    for (const id of [...unsynced]) if (!inflight.has(id) && !timers[id]) flush(id);
    for (const id of [...deletedPending]) flush(id);

      if (!projects.has(ui.current)) { ui.current = firstProjectId(); saveUI(); }
      if (editId && !cur()?.tasks.find(t => t.id === editId)) closeEditor(true);
      if (!editId && !drag) renderAll(); else renderHeader();
      if (first) requestAnimationFrame(() => scrollToDay(todayN(), .3));
    }
    refreshSyncDot();
  } catch (e) {
    if (e.code === 'auth') cloudReady = false;
    showDriveError(e, !first);
  } finally {
    pulling = false;
    if (pullAgain) { pullAgain = false; pull(); }
  }
}
async function connectDrive(){
  if (!clientId()) { openSetup(); return; }
  if (!tokenClient) { try { await initTokenClient(); } catch { setSync('offline', 'No se pudo cargar el inicio de sesión de Google. Comprueba la conexión.'); toast($('#sync').title); return; } }
  setSync('connecting');
  const ok = await requestToken(true);
  if (!ok) { setSync('auth', 'No se completó el acceso a Google Drive. Toca para intentarlo otra vez.'); return; }
  await pull(true);
}
function openSetup(){
  modal(`<h3>Conectar con Google Drive</h3><p>Pega el <b>Client ID</b> de Google (termina en <code>.apps.googleusercontent.com</code>). Solo hace falta una vez por dispositivo si no viene ya configurado.</p>
    <form id="mForm"><div class="fld"><label for="mIn">Client ID</label><input class="inp" id="mIn" value="${esc(clientId())}" autocomplete="off" spellcheck="false"></div>
    <div class="acts"><button type="button" class="btn" id="mNo">Ahora no</button><button class="btn primary">Guardar y conectar</button></div></form>`);
  $('#mNo').onclick = closeModal;
  $('#mForm').onsubmit = e => { e.preventDefault(); const v = $('#mIn').value.trim(); if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)) { toast('Ese Client ID no parece válido'); return; } LS.set('clientId', v); tokenClient = null; closeModal(); connectDrive(); };
}
async function initCloud(){
  if (!clientId()) { setSync('setup', 'Toca para configurar Google Drive. Mientras, todo se guarda en este dispositivo.'); return; }
  try { await initTokenClient(); } catch { setSync('offline', 'Sin conexión: se guarda en este dispositivo.'); }
  if (tokenValid()) await pull(true);

// ---------- model helpers ----------
const byId = (p, id) => p.tasks.find(t => t.id === id);

  for (const t of p.tasks){ const k = t.parent && ids.has(t.parent) ? t.parent : ''; if (!m.has(k)) m.set(k, []); m.get(k).push(t); }
  return m;
}
function rowsOf(p, all){
  const m = childrenMap(p), out = [];

  walk('', 0); return out;
}
function descendants(p, id){
  const m = childrenMap(p), out = [];
  const walk = k => { for (const t of (m.get(k) || [])) { out.push(t); walk(t.id); } };
  walk(id); return out;
}
function ancestors(p, t){ const out = []; let x = t; let n = 0; while (x && x.parent && n++ < 100){ x = byId(p, x.parent); if (x) out.push(x); } return out; }
function computeSpans(p){
  const m = childrenMap(p), S = new Map();

    if (S.has(t.id)) return S.get(t.id);

    let r;
    if (t.type === 'phase' && kids && kids.length){
      let a = Infinity, b = -Infinity; for (const k of kids){ const [x,y] = f(k); a = Math.min(a,x); b = Math.max(b,y); } r = [a,b];
    } else r = [toN(t.start), toN(t.end)];
    S.set(t.id, r); return r;
  };

}
function progressOf(p, t, S){
  if (t.type !== 'phase') return t.progress;
  const leaves = descendants(p, t.id).filter(x => x.type === 'task');
  if (!leaves.length) return t.progress;
  let w = 0, s = 0; for (const l of leaves){ const [a,b] = S.get(l.id); const d = b - a + 1; w += d; s += d * l.progress; }

// effective deps include ancestors' deps
function effDeps(p, t){ const s = new Set(t.deps); for (const a of ancestors(p, t)) a.deps.forEach(d => s.add(d)); return [...s]; }

// ---------- actions ----------
function addTask(type = 'task', inPhase){
  let p = cur(); if (!p) return;
  if (editId) closeEditor();
  const pre = JSON.stringify(p.tasks); const S = computeSpans(p);
  let parent = null, idx = p.tasks.length, start = todayN();
  const st = inPhase ? byId(p, inPhase) : sel && byId(p, sel);
  if (st){
    if (st.type === 'phase' && (inPhase || type !== 'phase')) { parent = st.id; const kids = descendants(p, st.id); const last = kids[kids.length-1]; idx = last ? p.tasks.indexOf(last) + 1 : p.tasks.indexOf(st) + 1; start = kids.length ? S.get(st.id)[1] + 1 : S.get(st.id)[0]; st.collapsed = false; }
    else { parent = st.type === 'phase' ? st.parent : st.parent; idx = p.tasks.indexOf(st) + 1; start = S.get(st.id)[1] + (st.type === 'milestone' ? 0 : 1); }
  } else if (p.tasks.length) {
    let mx = -Infinity; for (const t of p.tasks) mx = Math.max(mx, S.get(t.id)[1]); start = Math.max(todayN(), mx + 1 - 0) ; if (mx >= todayN()) start = mx + 1;
  }
  const par = parent && byId(p, parent);
  const t = normTask({ id: rid('t'), type, name: type === 'phase' ? 'Nueva fase' : type === 'milestone' ? 'Nuevo hito' : 'Nueva tarea',
    start: fromN(start), end: fromN(type === 'milestone' ? start : start + 4), progress: 0,
    color: par ? par.color : PALETTE[p.tasks.filter(x => !x.parent).length % PALETTE.length], parent, deps: [] }, 0);
  p.tasks.splice(idx, 0, t);
  pushUndo(pre); saveProject(p);
  editSnap = JSON.stringify(p.tasks); editId = t.id; sel = t.id;
  renderChart(); buildEditor(); $('#editor').classList.add('open');
  scrollTaskIntoView(t.id);
  setTimeout(() => { const n = $('#fName'); if (n && matchMedia('(pointer:fine)').matches){ n.focus(); n.select(); } }, 60);
}
function newProject(name, tasks){
  const id = rid('p');
  const p = normProject({ name: name || 'Nuevo proyecto', tasks: tasks || [], createdAt: Date.now() }, id);
  projects.set(id, p); ui.current = id; saveUI(); sel = null;
  if (editId) closeEditor(true);

  requestAnimationFrame(() => scrollToDay(todayN(), .15));

}

// zoom: discrete steps from far (months) to close (days)
const ZSTEPS = [['month',.6],['month',1],['month',1.6],['week',.75],['week',1],['week',1.5],['day',.65],['day',1],['day',1.5],['day',2.2]];
function setZoom(view, f){
  if (!L || !cur()) return;
  const center = L.rStart + (scroller.scrollLeft + (scroller.clientWidth - L.LW) / 2) / L.ppd;
  ui.zoom = view; ui.zf = f; saveUI(); renderHeader(); renderChart(false);
  scrollToDay(center, .5);
  const i = zIndex(); $('#zIn').disabled = i >= ZSTEPS.length - 1; $('#zOut').disabled = i <= 0;
}
function zIndex(){
  let best = 0, d = Infinity;
  ZSTEPS.forEach(([v, f], i) => { if (v === ui.zoom && Math.abs(f - (ui.zf || 1)) < d) { d = Math.abs(f - (ui.zf || 1)); best = i; } });
  return best;
}
function zoomStep(dir){ const i = Math.max(0, Math.min(ZSTEPS.length - 1, zIndex() + dir)); const [v, f] = ZSTEPS[i]; setZoom(v, f); }
$('#zoom').addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (b) setZoom(b.dataset.z, 1); });
$('#zIn').addEventListener('click', () => zoomStep(1));
$('#zOut').addEventListener('click', () => zoomStep(-1));

let wheelAcc = 0, wheelT = 0;
scroller.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); wheelAcc += e.deltaY;
  const now = Date.now(); if (Math.abs(wheelAcc) < 40 || now - wheelT < 180) return;
  wheelT = now; zoomStep(wheelAcc < 0 ? 1 : -1); wheelAcc = 0;
}, { passive: false });

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y' && !inField){ e.preventDefault(); redo(); }
  if (!inField && !e.metaKey && !e.ctrlKey && !e.altKey && !$('#modal').classList.contains('on')){
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomStep(1); return; }

// ---------- export ----------
const safeName = s => (s || 'gantt').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 80) || 'gantt';
async function saveFile(filename, data){
  const type = filename.endsWith('.png') ? 'image/png' : filename.endsWith('.pdf') ? 'application/pdf' : 'application/json';
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  // phones/tablets: share sheet (Guardar en Archivos, Drive, AirDrop…)
  try {
    const file = new File([blob], filename, { type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename }); return true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Archivo descargado'); return true;
  } catch { return false; }
}
function drawExport(p){
  const rows = rowsOf(p), S = computeSpans(p);
  const RH = 34, HH = 50, TH = 56, LWx = 300, PAD = 24;
  const tn = todayN();
  let a = Infinity, b = -Infinity; for (const t of p.tasks){ const [x,y] = S.get(t.id); a = Math.min(a,x); b = Math.max(b,y); }
  if (!isFinite(a)) { a = tn; b = tn + 30; }
  const ppd = { day: 26, week: 9, month: 3.2 }[ui.zoom];
  const lpad = { day:[2,10], week:[7,21], month:[15,45] }[ui.zoom];
  a -= lpad[0]; b += lpad[1];
  const fake = { rStart:a, rEnd:b, ppd, tn };
  if (ui.zoom === 'week'){ a -= (dt(a).getUTCDay()+6)%7; b += 6 - (dt(b).getUTCDay()+6)%7; fake.rStart = a; fake.rEnd = b; }
  if (ui.zoom === 'month'){ const d = dt(a); a = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)/DAY); const e = dt(b); b = Math.round(Date.UTC(e.getUTCFullYear(), e.getUTCMonth()+1, 1)/DAY) - 1; fake.rStart = a; fake.rEnd = b; }
  const TW = (b - a + 1) * ppd;
  const W = PAD*2 + LWx + TW, H = PAD*2 + TH + HH + rows.length * RH + 10;
  const scale = Math.min(2, 16000 / W, 16000 / H);
  const cv = document.createElement('canvas'); cv.width = Math.ceil(W * scale); cv.height = Math.ceil(H * scale);
  const c = cv.getContext('2d'); c.scale(scale, scale);
  const F = (w, s) => `${w} ${s}px Manrope, system-ui, sans-serif`;
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#1c1e23'; c.font = F(800, 22); c.textBaseline = 'alphabetic'; c.fillText(p.name, PAD, PAD + 24);
  c.fillStyle = '#5f6470'; c.font = F(500, 12);
  c.fillText(`${fmtY(isFinite(a)?a+lpad[0]:tn)} – ${fmtY(b - lpad[1])} · exportado el ${fmtY(tn)}`, PAD, PAD + 44);
  const ox = PAD + LWx, oy = PAD + TH; const X = n => ox + (n - a) * ppd;
  const M = scaleModel(fake);
  // header
  c.textBaseline = 'middle';
  c.strokeStyle = '#e3e3de'; c.lineWidth = 1;
  for (const s of M.top){ c.beginPath(); c.moveTo(ox + s.x + .5, oy); c.lineTo(ox + s.x + .5, oy + 24); c.stroke(); c.fillStyle = '#1c1e23'; c.font = F(700, 12); c.save(); c.beginPath(); c.rect(ox + s.x, oy, s.w, 24); c.clip(); c.fillText(s.l, ox + s.x + 6, oy + 12); c.restore(); }
  const bodyTop = oy + HH, bodyH = rows.length * RH;
  for (const u of M.bot){
    if (u.we){ c.fillStyle = '#f3f2ed'; c.fillRect(ox + u.x, oy + 24, u.w, HH - 24 + bodyH); }
    c.strokeStyle = u.mo ? '#e3e3de' : '#efefeb'; c.beginPath(); c.moveTo(ox + u.x + .5, oy + 24); c.lineTo(ox + u.x + .5, bodyTop + bodyH); c.stroke();
    c.fillStyle = '#1c1e23'; c.textAlign = 'center'; c.font = F(700, ui.zoom === 'day' ? 11 : 11);
    c.fillText(String(u.l), ox + u.x + u.w/2, oy + 24 + (HH - 24)/2); c.textAlign = 'left';
  }
  c.strokeStyle = '#e3e3de'; c.beginPath(); c.moveTo(PAD, bodyTop + .5); c.lineTo(ox + TW, bodyTop + .5); c.moveTo(PAD, oy + 24.5); c.lineTo(ox + TW, oy + 24.5); c.moveTo(ox + .5, oy); c.lineTo(ox + .5, bodyTop + bodyH); c.stroke();
  c.fillStyle = '#9096a2'; c.font = F(700, 11); c.fillText('TAREA', PAD + 6, oy + HH - 14);
  // rows
  rows.forEach(({ t, depth }, i) => {
    const y = bodyTop + i * RH;
    c.strokeStyle = '#efefeb'; c.beginPath(); c.moveTo(PAD, y + RH + .5); c.lineTo(ox + TW, y + RH + .5); c.stroke();
    c.fillStyle = t.color;
    const lx = PAD + 6 + depth * 14;
    if (t.type === 'milestone'){ c.save(); c.translate(lx + 5, y + RH/2); c.rotate(Math.PI/4); c.fillRect(-4, -4, 8, 8); c.restore(); } else c.fillRect(lx, y + RH/2 - 5, 10, 10);
    c.fillStyle = '#1c1e23'; c.font = F(t.type === 'phase' ? 800 : 500, 13);
    const maxW = LWx - (lx - PAD) - 64;
    let nm = t.name; while (c.measureText(nm).width > maxW && nm.length > 1) nm = nm.slice(0, -2) + '…';
    c.fillText(nm, lx + 18, y + RH/2);
    if (t.type !== 'milestone'){ c.fillStyle = '#5f6470'; c.font = F(500, 12); c.textAlign = 'right'; c.fillText(progressOf(p, t, S) + '%', PAD + LWx - 10, y + RH/2); c.textAlign = 'left'; }
  });
  // today
  if (tn >= a && tn <= b){ c.fillStyle = 'rgba(229,72,77,.75)'; c.fillRect(X(tn) + ppd/2 - 1, oy + 24, 2, HH - 24 + bodyH); }
  // arrows
  const rowIdx = new Map(rows.map((r, i) => [r.t.id, i]));
  const xs = t => { const [s, e] = S.get(t.id); if (t.type === 'milestone'){ const cc = X(s) + ppd/2; return [cc - 9, cc + 9]; } return [X(s), X(e + 1)]; };
  c.strokeStyle = '#9096a2'; c.fillStyle = '#9096a2'; c.lineWidth = 1.4;
  for (const t of p.tasks){ if (!rowIdx.has(t.id)) continue; for (const did of t.deps){ const d = byId(p, did); if (!d || !rowIdx.has(did)) continue;
    const y1 = bodyTop + rowIdx.get(did) * RH + RH/2, y2 = bodyTop + rowIdx.get(t.id) * RH + RH/2, x2 = xs(d)[1], x1 = xs(t)[0] - 1, gx = x2 + 7;
    c.beginPath(); c.moveTo(x2, y1); c.lineTo(gx, y1);
    if (x1 >= gx + 6){ c.lineTo(gx, y2); c.lineTo(x1, y2); } else { const ym = y2 > y1 ? y2 - RH/2 : y2 + RH/2; c.lineTo(gx, ym); c.lineTo(x1 - 9, ym); c.lineTo(x1 - 9, y2); c.lineTo(x1, y2); }
    c.stroke(); c.beginPath(); c.moveTo(x1, y2); c.lineTo(x1 - 6, y2 - 4); c.lineTo(x1 - 6, y2 + 4); c.fill(); } }
  // bars
  const rr = (x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  rows.forEach(({ t }, i) => {
    const y = bodyTop + i * RH; const [s, e] = S.get(t.id);
    c.font = F(600, 12); c.textBaseline = 'middle';
    if (t.type === 'milestone'){
      const cx = X(s) + ppd/2, cy = y + RH/2; c.save(); c.translate(cx, cy); c.rotate(Math.PI/4); c.fillStyle = t.color; c.fillRect(-7, -7, 14, 14); c.restore();
      c.fillStyle = '#1c1e23'; c.fillText(t.name + ' · ' + fmt(s), cx + 14, cy);
    } else if (t.type === 'phase'){
      const x = X(s), w = Math.max(6, (e - s + 1) * ppd), yy = y + RH/2 - 6, pr = progressOf(p, t, S);
      c.fillStyle = t.color; c.fillRect(x, yy, w, 8); c.beginPath(); c.moveTo(x, yy + 8); c.lineTo(x + 6, yy + 8); c.lineTo(x, yy + 14); c.fill(); c.beginPath(); c.moveTo(x + w, yy + 8); c.lineTo(x + w - 6, yy + 8); c.lineTo(x + w, yy + 14); c.fill();
      c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x, yy, w * pr / 100, 8);
      c.fillStyle = '#1c1e23'; c.font = F(800, 12); c.fillText(t.name + ' · ' + pr + '%', x + w + 8, y + RH/2);
    } else {
      const x = X(s), w = Math.max(6, (e - s + 1) * ppd), bh = 20, yy = y + (RH - bh)/2;
      c.fillStyle = t.color; rr(x, yy, w, bh, 6); c.fill();
      if (t.progress){ c.save(); rr(x, yy, w, bh, 6); c.clip(); c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(x, yy, w * t.progress / 100, bh); c.restore(); }
      const label = t.name + (t.who ? ' · ' + t.who : '');
      if (c.measureText(t.name).width + 18 < w){ c.fillStyle = '#fff'; c.font = F(700, 12); c.fillText(t.name, x + 8, y + RH/2); if (t.who){ c.fillStyle = '#5f6470'; c.font = F(500, 12); c.fillText(t.who, x + w + 8, y + RH/2); } }
      else { c.fillStyle = '#1c1e23'; c.fillText(label, x + w + 8, y + RH/2); }
    }
  });
  return cv;
}
async function exportPNG(){
  const p = cur(); if (!p) return;
  await document.fonts?.ready;
  const cv = drawExport(p);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (await saveFile(safeName(p.name) + '.png', blob)) return;
  modal(`<h3>Imagen del diagrama</h3><p>Mantén pulsada la imagen (o clic derecho) para guardarla.</p><img src="${cv.toDataURL('image/png')}" alt="Diagrama de Gantt"><div class="acts"><button class="btn primary" id="mNo">Cerrar</button></div>`);
  $('#mNo').onclick = closeModal;
}
let jsPDFp = null;
function loadJsPDF(){
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return jsPDFp ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload = () => res(window.jspdf); s.onerror = () => { jsPDFp = null; rej(); }; document.head.appendChild(s); });
}
async function exportPDF(){
  const p = cur(); if (!p) return;
  toast('Preparando PDF…');
  let lib; try { lib = await loadJsPDF(); } catch { toast('No se pudo preparar el PDF. Prueba con la imagen PNG.'); return; }
  await document.fonts?.ready;
  const cv = drawExport(p);
  // fit to A4/A3 landscape-ish page, or custom size for very long charts
  const w = cv.width, h = cv.height;
  const pageW = 842, pageH = 595; // A4 landscape in pt
  const sc = Math.min(pageW / w, pageH / h);
  let doc;
  if (sc * w >= pageW * .5 || sc * h >= pageH * .5) {
    doc = new lib.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const dw = w * sc, dh = h * sc; doc.addImage(cv.toDataURL('image/png'), 'PNG', (pageW - dw)/2, (pageH - dh)/2, dw, dh);
  } else {
    const dw = w / 2, dh = h / 2;
    doc = new lib.jsPDF({ orientation: dw > dh ? 'landscape' : 'portrait', unit: 'pt', format: [dw, dh] });
    doc.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, dw, dh);
  }
  const blob = doc.output('blob');
  if (await saveFile(safeName(p.name) + '.pdf', blob)) return;
  toast('Este dispositivo no permite descargar aquí. Usa la imagen PNG.');
}
async function exportJSON(){
  const p = cur(); if (!p) return;
  const data = JSON.stringify({ app: 'gantt', v: 1, exportedAt: new Date().toISOString(), project: { name: p.name, tasks: p.tasks } }, null, 2);
  if (await saveFile(safeName(p.name) + '.json', data)) return;
  modal(`<h3>Copia de seguridad</h3><p>Copia este texto y guárdalo en un archivo .json.</p><textarea class="inp" style="height:220px;font-family:ui-monospace,monospace;font-size:12px" readonly id="mTxt">${esc(data)}</textarea><div class="acts"><button class="btn" id="mNo">Cerrar</button><button class="btn primary" id="mCopy">Copiar</button></div>`);
  $('#mNo').onclick = closeModal;
  $('#mCopy').onclick = async () => { try { await navigator.clipboard.writeText(data); toast('Copiado'); } catch { $('#mTxt').select(); toast('Selecciona y copia el texto'); } };
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const list = d.project ? [d.project] : Array.isArray(d.projects) ? d.projects : Array.isArray(d.tasks) ? [d] : null;
    if (!list || !list.length) throw 0;
    let last;
    for (const pr of list){
      // re-id tasks to avoid collisions
      const map = {}; const tasks = (pr.tasks || []).map(t => { const n = rid('t'); map[t.id] = n; return Object.assign({}, t, { id: n }); });
      tasks.forEach(t => { t.parent = t.parent ? map[t.parent] || null : null; t.deps = (t.deps || []).map(x => map[x]).filter(Boolean); });
      const exists = [...projects.values()].some(x => x.name === pr.name);
      last = newProject((pr.name || f.name.replace(/\.json$/i, '')) + (exists ? ' (importado)' : ''), tasks);
    }
    toast(list.length > 1 ? `${list.length} proyectos importados` : 'Proyecto importado');
  } catch { toast('Ese archivo no es una copia de seguridad válida'); }
});

// ---------- start ----------
if (!projects.has(ui.current)) ui.current = firstProjectId();
setSync('connecting');
renderAll();
requestAnimationFrame(() => scrollToDay(todayN(), .3));
initCloud();
window.__gantt = { projects };
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
